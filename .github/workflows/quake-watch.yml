name: Earthquake Watch

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub sometimes runs a little late)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
    inputs:
      test:
        description: "Send 3 test buzzes to the phone?"
        type: boolean
        default: true

permissions:
  contents: write            # lets the robot save seen.json back to the repo

concurrency:
  group: quake-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check USGS for new earthquakes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: python3 quake_buzzer.py

      - name: Remember which quakes we already buzzed about
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "quake-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Remember buzzed quakes"
            git pull --rebase --quiet || true
            git push
          fi
